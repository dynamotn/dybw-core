# CI for GitLab: lint and vectors, tests, and the 100% coverage gates
# (lines on stable, branches on a pinned nightly).

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v/

stages: [check, test]

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo-home
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  UV_VERSION: 0.10.6
  # Newest nightly that builds the workspace; bump it here only.
  NIGHTLY: nightly-2026-10-01
  LLVM_COV_VERSION: ^0.9

default:
  image: rust:1-trixie
  interruptible: true

.cargo-cache:
  cache:
    key:
      prefix: $CI_JOB_NAME
      files: [Cargo.lock]
    paths:
      - .cargo-home/registry/index/
      - .cargo-home/registry/cache/
      - target/

check:
  stage: check
  extends: .cargo-cache
  script:
    - rustup component add rustfmt clippy
    - curl -LsSf "https://astral.sh/uv/$UV_VERSION/install.sh" | sh
    - export PATH="$HOME/.local/bin:$PATH"
    - apt-get update && apt-get install -y --no-install-recommends ripgrep
    - cargo fmt --all --check
    - cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
    - |
      tree=$(cargo tree -p dybw-core -e normal --no-default-features --prefix none) || exit 1
      if printf '%s\n' "$tree" | rg -q '^(tokio|reqwest|rsa|getrandom|aws-lc-rs|argon2) '; then
        echo "forbidden dependency in dybw-core"; exit 1
      fi
    - |
      tree=$(cargo tree -p dybw-core -e normal --prefix none) || exit 1
      if printf '%s\n' "$tree" | rg -q '^(tokio|reqwest|rsa|getrandom) '; then
        echo "forbidden dependency in dybw-core default build"; exit 1
      fi
    - |
      tree=$(cargo tree -p dybw-core-wasm -e normal --target wasm32-unknown-unknown --prefix none) || exit 1
      if printf '%s\n' "$tree" | rg -q '^(aws-lc-rs|aws-lc-sys|argon2|getrandom|tokio|reqwest|rsa) '; then
        echo "forbidden dependency in dybw-core-wasm"; exit 1
      fi
    - uv run vectors/gen/gen.py check

test:
  stage: test
  extends: .cargo-cache
  script:
    - cargo test --workspace --all-features --locked

# Bitwarden's SDK decrypts what the core encrypts (the plugin's `test:sdk`); builds the SDK from git.
sdk:
  stage: test
  extends: .cargo-cache
  script:
    - cargo test -p dybw-vectors --test sdk --locked -- --ignored

# The core must keep building for the browser (M5): no native-only dependency without the `native` feature.
wasm:
  stage: test
  extends: .cargo-cache
  script:
    - rustup target add wasm32-unknown-unknown
    - rustup component add clippy
    - cargo build -p dybw-core --no-default-features --locked --target wasm32-unknown-unknown
    - cargo build -p dybw-core-wasm --locked --target wasm32-unknown-unknown
    # bindings.rs compiles only for wasm32: the workspace clippy never sees it.
    - cargo clippy -p dybw-core-wasm --target wasm32-unknown-unknown --all-features --locked -- -D warnings

# The core in WASM (M5): the conformance vectors and crypto known answers under Node, Chromium and WebKit, and the
# size budget of the build without `vectors`. build-wasm.sh's size report imports esbuild, so `npm ci` comes first.
wasm-vectors:
  stage: test
  extends: .cargo-cache
  image: rust:1.99.1
  variables:
    BINARYEN_VERSION: version_133
    # sha256 of binaryen-version_133-x86_64-linux.tar.gz, from the release's .sha256 file.
    BINARYEN_SHA256: 2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489
    NODE_VERSION: v26.12.1
    # sha256 of node-v26.12.1-linux-x64.tar.xz, from nodejs.org's SHASUMS256.txt.
    NODE_SHA256: 6170b2d474e1c626f43cff3adc118df9fe3b573258a4fc3d850c8dbc6b079bbd
    WASM_BINDGEN_VERSION: 0.2.129
    DYBATPHO_COMMIT: 67b2b992c1fb6100a5ac8a65a1d7f92372feffb1
    DYBATPHO_DIR: $CI_PROJECT_DIR/.dybatpho
    WASM_OPT: $CI_PROJECT_DIR/.binaryen/bin/wasm-opt
  script:
    - rustup target add wasm32-unknown-unknown
    - cargo install wasm-bindgen-cli --locked --version "$WASM_BINDGEN_VERSION"
    - |
      tarball="binaryen-$BINARYEN_VERSION-x86_64-linux.tar.gz"
      curl -sSfLO "https://github.com/WebAssembly/binaryen/releases/download/$BINARYEN_VERSION/$tarball"
      echo "$BINARYEN_SHA256  $tarball" | sha256sum -c -
      mkdir .binaryen
      tar -xzf "$tarball" -C .binaryen --strip-components 1
    - |
      tarball="node-$NODE_VERSION-linux-x64.tar.xz"
      curl -sSfLO "https://nodejs.org/dist/$NODE_VERSION/$tarball"
      echo "$NODE_SHA256  $tarball" | sha256sum -c -
      mkdir .node
      tar -xJf "$tarball" -C .node --strip-components 1
    # CARGO_HOME is the cached .cargo-home, whose bin/ (wasm-bindgen) is not on the image's PATH.
    - export PATH="$CARGO_HOME/bin:$CI_PROJECT_DIR/.node/bin:$PATH"
    # build-wasm.sh is built on dybatpho: the public repository at a pinned commit, not a submodule.
    - git clone https://github.com/dynamotn/dybatpho.git "$DYBATPHO_DIR"
    - git -C "$DYBATPHO_DIR" checkout --detach "$DYBATPHO_COMMIT"
    - (cd crates/dybw-core-wasm/js && npm ci)
    # Without features first, so the size test never measures a stale build.
    - scripts/build-wasm.sh
    - scripts/build-wasm.sh --features vectors --out crates/dybw-core-wasm/js/pkg
    - cd crates/dybw-core-wasm/js
    - npx playwright install --with-deps chromium webkit
    - npx vitest run

coverage-lines:
  stage: test
  extends: .cargo-cache
  script:
    - rustup component add llvm-tools-preview
    - cargo install cargo-llvm-cov --locked --version "$LLVM_COV_VERSION"
    - cargo llvm-cov --workspace --all-features --locked --ignore-filename-regex 'crates/dybw-vectors/' --fail-under-lines 100

# cargo-llvm-cov has no branch threshold flag: read the percentage from the JSON summary.
coverage-branches:
  stage: test
  extends: .cargo-cache
  script:
    - rustup toolchain install "$NIGHTLY" --profile minimal --component llvm-tools-preview
    - rustup default "$NIGHTLY"
    - cargo install cargo-llvm-cov --locked --version "$LLVM_COV_VERSION"
    - >-
      cargo llvm-cov --branch --workspace --all-features --locked
      --ignore-filename-regex 'crates/dybw-vectors/' --json --summary-only --output-path branches.json
    - |
      python3 - <<'PY'
      import json, sys
      b = json.load(open("branches.json"))["data"][0]["totals"]["branches"]
      print("branch coverage", b)
      # A KeyError above fails the job; a crate with no branches reports percent 0, which is not a miss.
      sys.exit(0 if b["notcovered"] == 0 else 1)
      PY
