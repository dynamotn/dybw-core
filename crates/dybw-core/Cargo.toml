[package]
name = "dybw-core"
description = "Shared core of bwss and the Obsidian plugin: Bitwarden crypto, API, vault and sync rules"
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = ["native"]
native = ["dep:argon2"]
testing = []

[dependencies]
aes = { version = "0.9.3", features = ["zeroize"] }
argon2 = { version = "0.6.0", optional = true }
base64 = "0.23.1"
cbc = { version = "0.2.1", features = ["alloc", "zeroize"] }
hmac = "0.13.0"
pbkdf2 = "0.13.0"
sha2 = "0.11.1"
thiserror = "2.0.21"
zeroize = { version = "1.9.1", features = ["derive"] }

[dev-dependencies]
dybw-core = { path = ".", features = ["testing", "native"] }
serde_json = "1.0.154"

[lints]
workspace = true
