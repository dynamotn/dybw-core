[package]
name = "dybw-core"
description = "Shared core of bwss and the Obsidian plugin: Bitwarden crypto, API, vault and sync rules"
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = ["native"]
native = ["dep:argon2", "dep:aws-lc-rs"]
testing = []

[dependencies]
aes = { version = "0.9.3", features = ["zeroize"] }
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"], optional = true }
aws-lc-rs = { version = "1.18.2", default-features = false, features = ["aws-lc-sys", "alloc"], optional = true }
base64 = "0.23.1"
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
cbc = { version = "0.2.1", features = ["alloc", "zeroize"] }
futures-util = { version = "0.3.34", default-features = false }
hmac = "0.13.0"
pbkdf2 = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
time = { version = "0.3.55", default-features = false, features = ["parsing"] }
url = "2.5.8"
uuid = { version = "1.28.0", default-features = false }
zeroize = { version = "1.9.1", features = ["derive", "serde"] }

[dev-dependencies]
dybw-core = { path = ".", features = ["testing", "native"] }

[lints]
workspace = true
