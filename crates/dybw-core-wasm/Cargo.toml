[package]
name = "dybw-core-wasm"
description = "dybw-core for wasm32-unknown-unknown: the core's ports over a JS host"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# `runVectors` and `runKnownAnswers` for the JS harness (`js/`).
vectors = ["dep:dybw-vectors"]

[dependencies]
base64 = "0.23.1"
dybw-core = { path = "../dybw-core", default-features = false }
dybw-vectors = { path = "../dybw-vectors", default-features = false, optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zeroize = "1.9.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "=0.3.106"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"

[dev-dependencies]
dybw-core = { path = "../dybw-core", features = ["testing", "native"] }
dybw-vectors = { path = "../dybw-vectors" }

[lints]
workspace = true
