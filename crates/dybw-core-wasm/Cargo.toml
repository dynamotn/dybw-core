[package]
name = "dybw-core-wasm"
description = "dybw-core for wasm32-unknown-unknown: the core's ports over a JS host"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dybw-core = { path = "../dybw-core", default-features = false }
zeroize = "1.9.1"

[dev-dependencies]
dybw-core = { path = "../dybw-core", default-features = false, features = ["testing"] }

[lints]
workspace = true
