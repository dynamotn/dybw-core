# A GitHub release for each v* tag. dybw-core is a library: notes only, no binaries.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          # A tag with a pre-release part (v1.0.0-rc.1) is marked prerelease.
          [[ "$TAG" == *-* ]] && prerelease=(--prerelease)
          gh release create "$TAG" --verify-tag --generate-notes --title "dybw-core $TAG" "${prerelease[@]}"
