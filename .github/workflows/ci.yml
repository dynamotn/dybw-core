# CI for GitHub (mirror of GitLab). Same checks as .gitlab-ci.yml, which is kept for when minutes return.
# aws-lc-sys needs cmake and a C compiler; both ship on ubuntu-latest.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  UV_VERSION: 0.10.6
  # Newest nightly that builds the workspace; keep in step with .gitlab-ci.yml.
  NIGHTLY: nightly-2026-10-01
  LLVM_COV_VERSION: "0.9"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable ref; the input picks the toolchain
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - name: Install uv and ripgrep
        run: |
          curl -LsSf "https://astral.sh/uv/$UV_VERSION/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: No forbidden dependency in dybw-core (no default features)
        run: |
          tree=$(cargo tree -p dybw-core -e normal --no-default-features --prefix none) || exit 1
          if printf '%s\n' "$tree" | rg -q '^(tokio|reqwest|rsa|getrandom|aws-lc-rs|argon2) '; then
            echo "forbidden dependency in dybw-core"; exit 1
          fi
      - name: No forbidden dependency in dybw-core (default build)
        run: |
          tree=$(cargo tree -p dybw-core -e normal --prefix none) || exit 1
          if printf '%s\n' "$tree" | rg -q '^(tokio|reqwest|rsa|getrandom) '; then
            echo "forbidden dependency in dybw-core default build"; exit 1
          fi
      - name: No forbidden dependency in dybw-core-wasm (wasm32)
        run: |
          tree=$(cargo tree -p dybw-core-wasm -e normal --target wasm32-unknown-unknown --prefix none) || exit 1
          if printf '%s\n' "$tree" | rg -q '^(aws-lc-rs|aws-lc-sys|argon2|getrandom|tokio|reqwest|rsa) '; then
            echo "forbidden dependency in dybw-core-wasm"; exit 1
          fi
      - run: uv run vectors/gen/gen.py check
      - run: python3 -I vectors/gen/gen_totp.py --check
      - run: uv run vectors/gen/gen_protector.py --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable ref; the input picks the toolchain
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - run: cargo test --workspace --all-features --locked

  # Bitwarden's SDK decrypts what the core encrypts (the plugin's `test:sdk`); builds the SDK from git.
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable ref; the input picks the toolchain
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - run: cargo test -p dybw-vectors --test sdk --locked -- --ignored

  # The core must keep building for the browser (M5): no native-only dependency without the `native` feature.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable ref; the input picks the toolchain
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - run: cargo build -p dybw-core --no-default-features --locked --target wasm32-unknown-unknown
      - run: cargo build -p dybw-core-wasm --locked --target wasm32-unknown-unknown
      # bindings.rs compiles only for wasm32: the workspace clippy never sees it.
      - run: cargo clippy -p dybw-core-wasm --target wasm32-unknown-unknown --all-features --locked -- -D warnings

  # The core in WASM (M5): the conformance vectors and crypto known answers under Node, Chromium and WebKit, and the
  # size budget of the build without `vectors`. build-wasm.sh's size report imports esbuild, so `npm ci` comes first.
  wasm-vectors:
    runs-on: ubuntu-latest
    env:
      BINARYEN_VERSION: version_133
      # sha256 of binaryen-version_133-x86_64-linux.tar.gz, from the release's .sha256 file.
      BINARYEN_SHA256: 2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489
      DYBATPHO_DIR: ${{ github.workspace }}/.dybatpho
      WASM_OPT: ${{ github.workspace }}/.binaryen/bin/wasm-opt
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # build-wasm.sh is built on dybatpho: the public repository at a pinned commit, not a submodule.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: dynamotn/dybatpho
          ref: 67b2b992c1fb6100a5ac8a65a1d7f92372feffb1
          path: .dybatpho
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable ref; the input picks the toolchain
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177  # v2.87.30
        with:
          tool: wasm-bindgen@0.2.129
      - name: Install binaryen
        run: |
          tarball="binaryen-$BINARYEN_VERSION-x86_64-linux.tar.gz"
          curl -sSfLO "https://github.com/WebAssembly/binaryen/releases/download/$BINARYEN_VERSION/$tarball"
          echo "$BINARYEN_SHA256  $tarball" | sha256sum -c -
          mkdir .binaryen
          tar -xzf "$tarball" -C .binaryen --strip-components 1
          "$WASM_OPT" --version
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 26.12.1
      - run: npm ci
        working-directory: crates/dybw-core-wasm/js
      # Without features first, so the size test never measures a stale build.
      - run: scripts/build-wasm.sh
      - run: scripts/build-wasm.sh --features vectors --out crates/dybw-core-wasm/js/pkg
      - run: npx playwright install --with-deps chromium webkit
        working-directory: crates/dybw-core-wasm/js
      - run: npx vitest run
        working-directory: crates/dybw-core-wasm/js
      - name: Size report
        run: |
          {
            echo "### dybw-core-wasm size (build without vectors)"
            echo '```'
            node crates/dybw-core-wasm/js/size.mjs target-wasm/pkg
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  coverage-lines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable ref; the input picks the toolchain
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177  # v2.87.30
        with:
          tool: cargo-llvm-cov@${{ env.LLVM_COV_VERSION }}
      # rust-cache keeps target/, and stale target/llvm-cov-target data gives false misses.
      - run: cargo llvm-cov clean --workspace
      - run: cargo llvm-cov --workspace --all-features --locked --ignore-filename-regex 'crates/dybw-vectors/' --fail-under-lines 100

  # cargo-llvm-cov has no branch threshold flag: read the percentage from the JSON summary.
  coverage-branches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable ref; the input picks the toolchain
        with:
          toolchain: ${{ env.NIGHTLY }}
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177  # v2.87.30
        with:
          tool: cargo-llvm-cov@${{ env.LLVM_COV_VERSION }}
      - run: cargo llvm-cov clean --workspace
      - name: Measure branch coverage
        run: >-
          cargo llvm-cov --branch --workspace --all-features --locked
          --ignore-filename-regex 'crates/dybw-vectors/' --json --summary-only --output-path branches.json
      - name: Gate on zero uncovered branches
        run: |
          python3 - <<'PY'
          import json, sys
          b = json.load(open("branches.json"))["data"][0]["totals"]["branches"]
          print("branch coverage", b)
          # A KeyError above fails the job; a crate with no branches reports percent 0, which is not a miss.
          sys.exit(0 if b["notcovered"] == 0 else 1)
          PY
