# CI for GitHub (mirror of GitLab). Same checks as .gitlab-ci.yml, which is kept for when minutes return.
# aws-lc-sys needs cmake and a C compiler; both ship on ubuntu-latest.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  UV_VERSION: 0.10.6
  # Newest nightly that builds the workspace; keep in step with .gitlab-ci.yml.
  NIGHTLY: nightly-2026-10-01
  LLVM_COV_VERSION: "0.9"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable ref; the input picks the toolchain
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - name: Install uv and ripgrep
        run: |
          curl -LsSf "https://astral.sh/uv/$UV_VERSION/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: No forbidden dependency in dybw-core (no default features)
        run: |
          if cargo tree -p dybw-core -e normal --no-default-features --prefix none | rg -q '^(tokio|reqwest|rsa|getrandom|aws-lc-rs|argon2) '; then
            echo "forbidden dependency in dybw-core"; exit 1
          fi
      - name: No forbidden dependency in dybw-core (default build)
        run: |
          if cargo tree -p dybw-core -e normal --prefix none | rg -q '^(tokio|reqwest|rsa|getrandom) '; then
            echo "forbidden dependency in dybw-core default build"; exit 1
          fi
      - run: uv run vectors/gen/gen.py check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable ref; the input picks the toolchain
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - run: cargo test --workspace --all-features --locked

  coverage-lines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable ref; the input picks the toolchain
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177  # v2.87.30
        with:
          tool: cargo-llvm-cov@${{ env.LLVM_COV_VERSION }}
      - run: cargo llvm-cov --workspace --all-features --locked --ignore-filename-regex 'crates/dybw-vectors/' --fail-under-lines 100

  # cargo-llvm-cov has no branch threshold flag: read the percentage from the JSON summary.
  coverage-branches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable ref; the input picks the toolchain
        with:
          toolchain: ${{ env.NIGHTLY }}
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177  # v2.87.30
        with:
          tool: cargo-llvm-cov@${{ env.LLVM_COV_VERSION }}
      - name: Measure branch coverage
        run: >-
          cargo llvm-cov --branch --workspace --all-features --locked
          --ignore-filename-regex 'crates/dybw-vectors/' --json --summary-only --output-path branches.json
      - name: Gate on zero uncovered branches
        run: |
          python3 - <<'PY'
          import json, sys
          b = json.load(open("branches.json"))["data"][0]["totals"]["branches"]
          print("branch coverage", b)
          # A KeyError above fails the job; a crate with no branches reports percent 0, which is not a miss.
          sys.exit(0 if b["notcovered"] == 0 else 1)
          PY
